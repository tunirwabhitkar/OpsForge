name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby-v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Database setup
      env:
        RAILS_ENV: test
        DB_HOST: localhost
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
      run: |
        bundle exec rails db:create db:schema:load

    - name: Run tests
      env:
        RAILS_ENV: test
        DB_HOST: localhost
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
      run: |
        bundle exec rspec
