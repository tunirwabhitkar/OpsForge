default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>

development:
  <<: *default
  database: opsforge_development

test:
  <<: *default
  database: opsforge_test

production:
  <<: *default
  database: opsforge_production
  username: opsforge
  password: <%= ENV["OPSFORGE_DATABASE_PASSWORD"] %>
  host: <%= ENV["DB_HOST"] %>
